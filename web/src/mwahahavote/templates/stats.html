<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Estadísticas de votos y participación para la competencia de generación de humor.">
  <meta name="author" content="Santiago Castro, Luis Chiruzzo, Naihao Deng, Julie-Anne Meaney, Santiago Góngora, Ignacio Sastre, Victoria Amoroso, Guillermo Rey, Salar Rahili, Guillermo Moncecchi, Juan José Prada, Aiala Rosá, Rada Mihalcea">
  <link rel="apple-touch-icon" href="img/favicon.avif">

  <title>Estadísticas</title>

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
        integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <style>
    .chart {
      height: 500px;
      width: 100%;
      max-width: 900px;
    }
  </style>
</head>

<body>
  <div class="container" style="padding: 0 16px">
    <h1>Estadísticas</h1>

    <p>Cantidad total de votos: {{ stats['votes'] }}</p>
    <p>Cantidad de sesiones: {{ stats['sessions'] }}</p>

    <p>Distribución de votos por prompt:</p>
    <div id="chart-histogram" class="chart"></div>

    <p>Votos por categoría:</p>
    <div id="chart-votes-per-category" class="chart"></div>

    <h2>Votos sin salteos</h2>

    <p>Cantidad de votos: {{ stats['votes-without-skips'] }}</p>
    <p>Cantidad de sesiones: {{ stats['sessions-without-skips'] }}</p>
  </div>

  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <!--suppress JSUnresolvedFunction, JSUnresolvedVariable -->
  <script type="text/javascript">
    google.charts.load('current', {packages:['corechart']});

    google.charts.setOnLoadCallback(drawHistogramChart);
    function drawHistogramChart() {
      const data = google.visualization.arrayToDataTable({{ stats['histogram']|safe }});
      const options = {
        legend: { position: 'none' },
        colors: ['#4285F4'],
      };
      const chart = new google.visualization.ColumnChart(document.getElementById('chart-histogram'));
      chart.draw(data, options);
    }

    google.charts.setOnLoadCallback(drawVotesPerCategoryChart);
    function drawVotesPerCategoryChart() {
      const data = google.visualization.arrayToDataTable({{ stats['votes-per-category']|safe }});
      const options = {};
      const chart = new google.visualization.PieChart(document.getElementById('chart-votes-per-category'));
      chart.draw(data, options);
    }

    window.addEventListener('resize', () => {
      if (google.visualization) {
        drawHistogramChart();
        drawVotesPerCategoryChart();
      }
    });
  </script>
</body>

</html>
