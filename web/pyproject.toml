[project]
name = "mwahahavote"
version = "0.1.0.dev0"
description = "A web app to crowd-annotate for the MWAHAHA competition."
authors = [{ name = "Santiago Castro", email = "sacastro@fing.edu.uy" }]
requires-python = ">=3.15"
dependencies = [
    "cryptography", # Also required for the database authentication when using `asyncmy`.
    "fastapi<1",
    "httptools", # Faster HTTP parser picked up by uvicorn.
    "httpx2>=2,<3",
    "jinja2<4",
    "pandas<4",
    "python-multipart<1", # For forms in FastAPI.
    "sentry-sdk<3",
    "sqlalchemy[asyncmy]<3",
    "starlette",
    "uvicorn<1",
    "uvloop", # Fast, drop-in replacement of the built-in asyncio event loop picked up by uvicorn.
]

[project.urls]
homepage = "https://thefunnier.com/"
repository = "https://github.com/pln-fing-udelar/mwahaha-vote-webapp"

[project.optional-dependencies]
scripts = [
    "aioitertools<1",
    # We better pin the version to ensure the reproducibility of the scoring.
    # We don't use the latest stable version because it has some dependency issues, and this fork has a bugfix.
    # We don't use the one from upstream because it obliges us to install `torch`.
    "fschat[webui] @ git+https://github.com/pln-fing-udelar/FastChat@431f847",
    "fsspec[http]<2027",
    "huggingface-hub>=0.34.0,<2", # For `fschat`.
    "tqdm<5",
]

[dependency-groups]
dev = [
    "aiosqlite<1",
    "ipython>=2,<10",
    "jq<2",
    "mwahahavote[scripts]",
    "mycli<3",
    "pandas-stubs",
    "playwright<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.3,<1",
    "ty<1",
    "types-tqdm",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["scripts"]

[tool.ruff]
include = ["pyproject.toml", "scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "mwahahavote"]

[tool.ruff.lint]
ignore = [
    "ANN002", # `*args` / `**kwargs`: the only annotation that fits is `Any`, which ANN401 then rejects.
    "ANN003",
    "ANN401", # Allow `Any` for function args.
]
select = ["ANN", "B", "C", "C90", "E", "F", "I", "N", "RUF", "TID", "UP", "W"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts/**/*.py", "src/**/*.py", "tests/**/*.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.xml]
output = "test-reports/coverage.xml"

[tool.coverage.html]
directory = "test-reports/htmlcov"
